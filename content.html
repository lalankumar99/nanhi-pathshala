<script>

/* ============================================================
   DEMO LEARNING CONTENT
============================================================ */

const demoLearningContent = [

    {
        id: "demo-mathematics",
        parentId: null,
        type: "folder",
        name: "Mathematics",
        description: "Numbers, formulas and practice",
        icon: "📐",
        order: 1
    },

    {
        id: "demo-science",
        parentId: null,
        type: "folder",
        name: "Science",
        description: "Discover science and experiments",
        icon: "🔬",
        order: 2
    },

    {
        id: "demo-english",
        parentId: null,
        type: "folder",
        name: "English",
        description: "Grammar, stories and vocabulary",
        icon: "📘",
        order: 3
    },

    {
        id: "demo-math-basics",
        parentId: "demo-mathematics",
        type: "file",
        name: "Basic Mathematics",
        description: "Numbers and basic calculations",
        fileType: "HTML",
        url: "#",
        order: 1
    },

    {
        id: "demo-science-video",
        parentId: "demo-science",
        type: "video",
        name: "Science Introduction",
        description: "Introduction to the world of science",
        videoUrl: "https://www.youtube.com/",
        order: 1
    },

    {
        id: "demo-english-grammar",
        parentId: "demo-english",
        type: "file",
        name: "English Grammar",
        description: "Learn basic English grammar",
        fileType: "HTML",
        url: "#",
        order: 1
    }

];


/* ============================================================
   CURRENT FOLDER
============================================================ */

let currentFolderId = null;


/* ============================================================
   GET CHILDREN
============================================================ */

function getChildren(
    items,
    parentId
) {

    return items
        .filter(
            item =>
                (item.parentId || null) ===
                parentId
        )
        .sort(
            (a, b) =>
                (a.order || 0) -
                (b.order || 0)
        );

}


/* ============================================================
   SAFE TEXT
============================================================ */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   RENDER CONTENT
============================================================ */

function renderLearningContent(
    items,
    parentId = null,
    showDemo = false
) {

    if (!contentRoot) {
        return;
    }


    currentFolderId =
        parentId;


    contentRoot.innerHTML =
        "";


    const children =
        getChildren(
            items,
            parentId
        );


    if (
        children.length === 0
    ) {

        contentRoot.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-icon">
                    📚
                </div>

                <h3 class="empty-state-title">
                    No Content Yet
                </h3>

                <p class="empty-state-text">
                    Learning materials will appear here
                    when the admin adds them.
                </p>

            </div>

        `;

        return;
    }


    if (showDemo) {

        const badge =
            document.createElement("div");

        badge.className =
            "demo-badge";

        badge.textContent =
            "Demo Content";

        contentRoot.appendChild(
            badge
        );

    }


    const folders =
        children.filter(
            item =>
                item.type === "folder"
        );


    const files =
        children.filter(
            item =>
                item.type === "file"
        );


    const videos =
        children.filter(
            item =>
                item.type === "video"
        );


    /* ========================================================
       FOLDERS
    ======================================================== */

    if (folders.length > 0) {

        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "folder-grid";


        folders.forEach(
            folder => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "folder-card";


                button.innerHTML = `

                    <div class="folder-icon">
                        ${escapeHTML(
                            folder.icon || "📁"
                        )}
                    </div>

                    <div>

                        <div class="folder-name">
                            ${escapeHTML(
                                folder.name ||
                                "Folder"
                            )}
                        </div>

                        <div class="folder-description">
                            ${escapeHTML(
                                folder.description ||
                                "Open folder"
                            )}
                        </div>

                    </div>

                    <span class="folder-count">
                        →
                    </span>

                `;


                button.addEventListener(
                    "click",
                    () => {

                        openFolder(
                            folder,
                            items
                        );

                    }
                );


                grid.appendChild(
                    button
                );

            }
        );


        contentRoot.appendChild(
            grid
        );

    }


    /* ========================================================
       FILES
    ======================================================== */

    if (files.length > 0) {

        const title =
            document.createElement(
                "h3"
            );

        title.className =
            "section-label";

        title.textContent =
            "Files & Notes";


        contentRoot.appendChild(
            title
        );


        const list =
            document.createElement(
                "div"
            );

        list.className =
            "file-list";


        files.forEach(
            file => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "file-card";


                button.innerHTML = `

                    <div class="file-icon">
                        ${getFileIcon(
                            file.fileType
                        )}
                    </div>

                    <div class="file-info">

                        <div class="file-name">
                            ${escapeHTML(
                                file.name ||
                                "File"
                            )}
                        </div>

                        <div class="file-description">
                            ${escapeHTML(
                                file.description ||
                                "Learning material"
                            )}
                        </div>

                    </div>

                    <span class="file-type">
                        ${escapeHTML(
                            file.fileType ||
                            "FILE"
                        )}
                    </span>

                `;


                button.addEventListener(
                    "click",
                    () => {

                        openFile(
                            file
                        );

                    }
                );


                list.appendChild(
                    button
                );

            }
        );


        contentRoot.appendChild(
            list
        );

    }


    /* ========================================================
       VIDEOS
    ======================================================== */

    if (videos.length > 0) {

        const title =
            document.createElement(
                "h3"
            );

        title.className =
            "section-label";

        title.textContent =
            "Videos";


        contentRoot.appendChild(
            title
        );


        videos.forEach(
            video => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "video-card";


                button.innerHTML = `

                    <div class="video-thumbnail">
                        ▶
                    </div>

                    <div class="video-info">

                        <div class="video-title">
                            ${escapeHTML(
                                video.name ||
                                "Learning Video"
                            )}
                        </div>

                        <div class="video-description">
                            ${escapeHTML(
                                video.description ||
                                "Watch and learn"
                            )}
                        </div>

                    </div>

                `;


                button.addEventListener(
                    "click",
                    () => {

                        openVideo(
                            video
                        );

                    }
                );


                contentRoot.appendChild(
                    button
                );

            }
        );

    }

}

<script>

/* ============================================================
   FILE ICON
============================================================ */

function getFileIcon(fileType) {

    const type =
        String(
            fileType || ""
        ).toLowerCase();


    if (
        type === "pdf"
    ) {

        return "📕";

    }


    if (
        type === "video"
    ) {

        return "🎬";

    }


    if (
        type === "html" ||
        type === "web"
    ) {

        return "🌐";

    }


    if (
        type === "image" ||
        type === "jpg" ||
        type === "png"
    ) {

        return "🖼️";

    }


    if (
        type === "document" ||
        type === "doc"
    ) {

        return "📄";

    }


    return "📁";

}


/* ============================================================
   FOLDER OPEN
============================================================ */

function openFolder(
    folder,
    items
) {

    const folderId =
        folder.id;


    const children =
        getChildren(
            items,
            folderId
        );


    if (
        children.length === 0
    ) {

        contentRoot.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-icon">
                    📂
                </div>

                <h3 class="empty-state-title">
                    Folder is Empty
                </h3>

                <p class="empty-state-text">
                    New files and learning materials
                    will appear here when the admin
                    adds them.
                </p>

            </div>

        `;

        return;

    }


    renderLearningContent(
        items,
        folderId,
        false
    );

}


/* ============================================================
   FILE OPEN
============================================================ */

function openFile(file) {

    const url =
        file.url ||
        file.fileUrl;


    if (!url) {

        alert(
            "This file is not available yet."
        );

        return;

    }


    if (
        url === "#"
    ) {

        alert(
            "This is a demo learning file."
        );

        return;

    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* ============================================================
   YOUTUBE VIDEO
============================================================ */

function openVideo(video) {

    const url =
        video.videoUrl ||
        video.url;


    if (!url) {

        alert(
            "Video is not available yet."
        );

        return;

    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}

</script>
<script type="module">

import {
    db
} from "./firebase.js";

import {
    collection,
    query,
    orderBy,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ============================================================
   FIREBASE CONTENT LOADING
============================================================ */

const contentQuery =
    query(
        collection(
            db,
            "learningContent"
        ),
        orderBy(
            "order",
            "asc"
        )
    );


onSnapshot(
    contentQuery,
    (snapshot) => {

        const firebaseItems = [];


        snapshot.forEach(
            (itemSnapshot) => {

                firebaseItems.push({

                    id:
                        itemSnapshot.id,

                    ...itemSnapshot.data()

                });

            }
        );


        /*
        If Firebase contains content,
        use Firebase content.

        Otherwise show demo content.
        */

        if (
            firebaseItems.length > 0
        ) {

            renderLearningContent(
                firebaseItems,
                null,
                false
            );

        } else {

            renderLearningContent(
                demoLearningContent,
                null,
                true
            );

        }


        const status =
            document.getElementById(
                "firebaseStatus"
            );

        const statusText =
            document.getElementById(
                "firebaseStatusText"
            );


        status.classList.add(
            "connected"
        );

        status.classList.remove(
            "error"
        );

        statusText.textContent =
            firebaseItems.length > 0
                ? "Live learning content"
                : "Demo content • Ready for learning";

    },


    (error) => {

        console.error(
            "Firebase content loading error:",
            error
        );


        /*
        Firebase unavailable:
        keep the page useful with demo content.
        */

        renderLearningContent(
            demoLearningContent,
            null,
            true

<script>

/* ============================================================
   BREADCRUMB
============================================================ */

let breadcrumbPath = [];


function createBreadcrumb(
    folderId,
    items
) {

    const existing =
        document.getElementById(
            "breadcrumb"
        );


    if (existing) {

        existing.remove();

    }


    if (!folderId) {

        return;

    }


    const path = [];

    let currentId =
        folderId;


    while (currentId) {

        const folder =
            items.find(
                item =>
                    item.id === currentId
            );


        if (!folder) {
            break;
        }


        path.unshift(
            folder
        );


        currentId =
            folder.parentId || null;

    }


    breadcrumbPath =
        path;


    const breadcrumb =
        document.createElement(
            "div"
        );

    breadcrumb.id =
        "breadcrumb";

    breadcrumb.className =
        "breadcrumb visible";


    const homeButton =
        document.createElement(
            "button"
        );

    homeButton.type =
        "button";

    homeButton.textContent =
        "Home";


    homeButton.addEventListener(
        "click",
        () => {

            renderLearningContent(
                window.nanhiLearningContent ||
                demoLearningContent,
                null,
                false
            );

        }
    );


    breadcrumb.appendChild(
        homeButton
    );


    path.forEach(
        (folder, index) => {

            const separator =
                document.createElement(
                    "span"
                );

            separator.className =
                "breadcrumb-separator";

            separator.textContent =
                "›";


            breadcrumb.appendChild(
                separator
            );


            const folderButton =
                document.createElement(
                    "button"
                );

            folderButton.type =
                "button";

            folderButton.textContent =
                folder.name;


            folderButton.addEventListener(
                "click",
                () => {

                    renderLearningContent(
                        window.nanhiLearningContent ||
                        demoLearningContent,
                        folder.id,
                        false
                    );

                }
            );


            breadcrumb.appendChild(
                folderButton
            );

        }
    );


    contentRoot.prepend(
        breadcrumb
    );

}


/* ============================================================
   UPDATE FOLDER VIEW
============================================================ */

const originalOpenFolder =
    openFolder;


openFolder = function (
    folder,
    items
) {

    createBreadcrumb(
        folder.id,
        items
    );


    originalOpenFolder(
        folder,
        items
    );

};


</script>

<script>

/* ============================================================
   CONTENT SEARCH
============================================================ */

function searchLearningContent(
    searchText,
    items
) {

    const text =
        String(
            searchText || ""
        )
        .trim()
        .toLowerCase();


    if (!text) {

        renderLearningContent(
            items,
            null,
            items === demoLearningContent
        );

        return;

    }


    const results =
        items.filter(
            item => {

                const name =
                    String(
                        item.name || ""
                    ).toLowerCase();

                const description =
                    String(
                        item.description || ""
                    ).toLowerCase();

                return (
                    name.includes(text) ||
                    description.includes(text)
                );

            }
        );


    if (
        results.length === 0
    ) {

        contentRoot.innerHTML = `

            <div class="empty-state">

                <div class="empty-state-icon">
                    🔎
                </div>

                <h3 class="empty-state-title">
                    No Results Found
                </h3>

                <p class="empty-state-text">
                    Try searching for another
                    lesson, folder or file.
                </p>

            </div>

        `;

        return;

    }


    contentRoot.innerHTML = "";


    const list =
        document.createElement(
            "div"
        );

    list.className =
        "file-list";


    results.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "file-card";


            button.innerHTML = `

                <div class="file-icon">
                    ${
                        item.type === "folder"
                            ? "📁"
                            : item.type === "video"
                                ? "🎬"
                                : "📄"
                    }
                </div>

                <div class="file-info">

                    <div class="file-name">
                        ${escapeHTML(
                            item.name ||
                            "Content"
                        )}
                    </div>

                    <div class="file-description">
                        ${escapeHTML(
                            item.description ||
                            "Learning content"
                        )}
                    </div>

                </div>

                <span class="file-type">
                    ${escapeHTML(
                        item.type ||
                        "FILE"
                    )}
                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    if (
                        item.type === "folder"
                    ) {

                        openFolder(
                            item,
                            items
                        );

                    }

                    else if (
                        item.type === "video"
                    ) {

                        openVideo(
                            item
                        );

                    }

                    else {

                        openFile(
                            item
                        );

                    }

                }
            );


            list.appendChild(
                button
            );

        }
    );


    contentRoot.appendChild(
        list
    );

}

    };
