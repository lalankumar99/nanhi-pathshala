<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#f59e0b">
    <meta name="msapplication-TileColor" content="#f59e0b">

    <title>Login • Nanhi Pathshala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Nunito", sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #ccfbf1 0,
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    #fef3c7 0,
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #ffffff,
                    #fffbeb
                );

            color: #134e4a;

            -webkit-tap-highlight-color: transparent;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* =========================
           BACKGROUND
        ========================== */

        .blob {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
        }

        .blob-one {
            width: 230px;
            height: 230px;

            top: -100px;
            left: -80px;

            background: #99f6e4;

            opacity: .45;

            filter: blur(10px);
        }

        .blob-two {
            width: 200px;
            height: 200px;

            right: -70px;
            top: 90px;

            background: #fde68a;

            opacity: .50;

            filter: blur(10px);
        }

        .blob-three {
            width: 270px;
            height: 270px;

            bottom: -160px;
            left: 50%;

            transform: translateX(-50%);

            background: #bfdbfe;

            opacity: .28;

            filter: blur(15px);
        }

        /* =========================
           LANGUAGE
        ========================== */

        .top-bar {
            position: absolute;

            top: 16px;
            right: 16px;

            z-index: 20;
        }

        .language-button {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 9px 14px;

            border-radius: 999px;

            background: rgba(255,255,255,.80);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(255,255,255,.95);

            color: #0f766e;

            font-size: 13px;
            font-weight: 800;

            box-shadow:
                0 6px 20px rgba(15,118,110,.08);

            transition: .2s;
        }

        .language-button:active {
            transform: scale(.96);
        }

        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            position: relative;
            z-index: 5;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 75px 18px 35px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;

            animation:
                loginEntrance .65s ease-out both;
        }

        @keyframes loginEntrance {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }

        /* =========================
           BRAND
        ========================== */

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 78px;
            height: 78px;

            margin: 0 auto 12px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #2dd4bf,
                    #0d9488
                );

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 15px 32px rgba(13,148,136,.22),
                inset 0 2px 5px rgba(255,255,255,.35);

            animation:
                logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }

        /* =========================
           BOOK LOGO
        ========================== */

        .book {
            width: 45px;
            height: 35px;

            position: relative;
        }

        .book-left,
        .book-right {
            position: absolute;

            top: 3px;

            width: 23px;
            height: 29px;

            background: white;
        }

        .book-left {
            left: 0;

            border-radius:
                5px 2px 2px 5px;
        }

        .book-right {
            right: 0;

            border-radius:
                2px 5px 5px 2px;
        }

        .book-line {
            position: absolute;

            z-index: 3;

            width: 15px;
            height: 2.5px;

            border-radius: 5px;

            background: #5eead4;
        }

        .line1 {
            top: 11px;
            left: 4px;
        }

        .line2 {
            top: 11px;
            left: 27px;
        }

        .line3 {
            top: 19px;
            left: 4px;
        }

        .line4 {
            top: 19px;
            left: 27px;
        }

        .brand h1 {
            font-family: "Quicksand", sans-serif;

            font-size: 30px;

            font-weight: 900;

            color: #134e4a;
        }

        .brand p {
            margin-top: 3px;

            color: #0d9488;

            font-size: 14px;

            font-weight: 800;
        }

        /* =========================
           LOGIN CARD
        ========================== */

        .card {
            background:
                rgba(255,255,255,.94);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border:
                1px solid rgba(255,255,255,.95);

            border-radius: 30px;

            box-shadow:
                0 25px 65px
                rgba(15,23,42,.10);

            overflow: hidden;
        }

        .card-header {
            padding: 26px 24px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #14b8a6,
                    #0d9488
                );
        }

        .card-header h2 {
            font-family: "Quicksand", sans-serif;

            font-size: 26px;

            font-weight: 900;
        }

        .card-header p {
            margin-top: 5px;

            color: #ccfbf1;

            font-size: 13px;

            font-weight: 700;
        }

        .form {
            padding: 27px 24px 25px;
        }

        /* =========================
           FORM FIELDS
        ========================== */

        .field {
            margin-bottom: 18px;
        }

        .label {
            display: block;

            margin-bottom: 7px;

            color: #475569;

            font-size: 13px;

            font-weight: 900;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 17px;

            pointer-events: none;
        }

        .input {
            width: 100%;
            height: 53px;

            padding:
                0 46px;

            border:
                2px solid #e2e8f0;

            border-radius: 15px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 15px;

            font-weight: 700;

            transition: .2s;
        }

        .input:focus {
            outline: none;

            border-color: #14b8a6;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(20,184,166,.10);
        }

        .input::placeholder {
            color: #94a3b8;
        }

        .password-toggle {
            position: absolute;

            right: 9px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            border-radius: 10px;

            background: transparent;

            color: #94a3b8;

            font-size: 17px;
        }

        .password-toggle:active {
            background: #f1f5f9;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            display: none;

            margin-bottom: 17px;

            padding: 12px 14px;

            border-radius: 13px;

            font-size: 12px;

            font-weight: 800;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .message.success {
            background: #dcfce7;
            color: #15803d;
        }

        /* Continue in Part 2 */

    </style>

</head>

<body>

    <div class="page">

        <div class="blob blob-one"></div>

        <div class="blob blob-two"></div>

        <div class="blob blob-three"></div>

        <div class="top-bar">

            <button
                type="button"
                class="language-button"
                id="languageButton"
            >
                🌐 English
            </button>

        </div>

        <main class="container">

            <div class="login-wrapper">

                <div class="brand">

                    <div class="brand-icon">

                        <div class="book">

                            <div class="book-left"></div>

                            <div class="book-right"></div>

                            <div class="book-line line1"></div>

                            <div class="book-line line2"></div>

                            <div class="book-line line3"></div>

                            <div class="book-line line4"></div>

                        </div>

                    </div>

                    <h1>
                        Nanhi Pathshala
                    </h1>

                    <p>
                        Learn • Play • Grow
                    </p>

                </div>

                <section class="card">

                    <header class="card-header">

                        <h2>
                            Welcome Back
                        </h2>

                        <p>
                            Continue your learning journey
                        </p>

                    </header>

                    <form
                        class="form"
                        id="loginForm"
                    >

                        <div
                            class="message"
                            id="message"
                        ></div>
                        <div class="field">

                            <label
                                class="label"
                                for="email"
                            >
                                Email Address
                            </label>

                            <div class="input-wrap">

                                <span class="input-icon">
                                    ✉️
                                </span>

                                <input
                                    class="input"
                                    id="email"
                                    type="email"
                                    autocomplete="email"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>

                        </div>


                        <div class="field">

                            <label
                                class="label"
                                for="password"
                            >
                                Password
                            </label>

                            <div class="input-wrap">

                                <span class="input-icon">
                                    🔒
                                </span>

                                <input
                                    class="input"
                                    id="password"
                                    type="password"
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="passwordToggle"
                                    aria-label="Show password"
                                >
                                    👁️
                                </button>

                            </div>

                        </div>


                        <div class="options">

                            <label class="remember">

                                <input
                                    type="checkbox"
                                    id="remember"
                                >

                                <span>
                                    Remember me
                                </span>

                            </label>


                            <button
                                type="button"
                                class="forgot"
                                id="forgotButton"
                            >
                                Forgot password?
                            </button>

                        </div>


                        <button
                            type="submit"
                            class="login-button"
                            id="loginButton"
                        >
                            Login Securely
                            <span>→</span>
                        </button>


                        <div class="register-box">

                            <p>
                                New to Nanhi Pathshala?
                            </p>

                            <button
                                type="button"
                                class="register-button"
                                id="registerButton"
                            >
                                Create New Account
                            </button>

                        </div>


                        <div class="secure">

                            <span>
                                🔐
                            </span>

                            <span>
                                Secure login powered by Firebase
                            </span>

                        </div>

                    </form>

                </section>


                <div class="footer">

                    Nanhi Pathshala
                    •
                    Learn • Play • Grow

                </div>

            </div>

        </main>

    </div>
    <style>

        /* =========================
           OPTIONS
        ========================== */

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin: 4px 0 21px;

            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #64748b;
            font-weight: 700;

            cursor: pointer;
        }

        .remember input {
            width: 16px;
            height: 16px;

            padding: 0;

            accent-color: #14b8a6;

            cursor: pointer;
        }

        .forgot {
            border: none;
            background: transparent;

            color: #0d9488;

            font-size: 12px;
            font-weight: 900;

            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {
            width: 100%;
            height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #fbbf24,
                    #f59e0b
                );

            color: #172554;

            font-size: 16px;
            font-weight: 900;

            box-shadow:
                0 10px 22px
                rgba(245,158,11,.22);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px
                rgba(245,158,11,.28);
        }

        .login-button:active {
            transform: scale(.98);
        }

        .login-button:disabled {
            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           REGISTER
        ========================== */

        .register-box {
            margin-top: 22px;

            text-align: center;

            color: #64748b;

            font-size: 13px;

            font-weight: 700;
        }

        .register-button {
            margin-top: 5px;

            border: none;

            background: transparent;

            color: #0d9488;

            font-size: 14px;

            font-weight: 900;

            cursor: pointer;
        }

        .register-button:hover {
            text-decoration: underline;
        }


        /* =========================
           SECURITY
        ========================== */

        .secure {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 11px;

            font-weight: 700;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 11px;

            font-weight: 700;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 380px) {

            .container {
                padding-left: 14px;
                padding-right: 14px;
            }

            .brand h1 {
                font-size: 27px;
            }

            .card {
                border-radius: 25px;
            }

            .form {
                padding: 22px 18px;
            }

            .card-header {
                padding: 23px 18px;
            }

        }


        @media (max-height: 650px) {

            .container {
                padding-top: 60px;
                padding-bottom: 20px;
            }

            .brand {
                margin-bottom: 14px;
            }

            .brand-icon {
                width: 62px;
                height: 62px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 25px;
            }

            .brand p {
                font-size: 12px;
            }

            .form {
                padding-top: 20px;
                padding-bottom: 20px;
            }

        }

    </style>


    <script type="module">

        import { auth } from "./firebase.js";

        import {
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        function showMessage(text, type = "error") {

            message.textContent = text;

            message.className =
                "message show " + type;

        }


        /* =========================
           PASSWORD SHOW / HIDE
        ========================== */

        document
            .getElementById("passwordToggle")
            .addEventListener(
                "click",
                () => {

                    const isHidden =
                        passwordInput.type === "password";

                    passwordInput.type =
                        isHidden
                            ? "text"
                            : "password";

                    document.getElementById(
                        "passwordToggle"
                    ).textContent =
                        isHidden
                            ? "🙈"
                            : "👁️";

                }
            );


        /* =========================
           LOGIN
        ========================== */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password."
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.innerHTML =
                    "Signing in...";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    showMessage(
                        "Login successful!",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "home.html";

                    }, 700);


                } catch (error) {

                    let errorText =
                        "Login failed. Please check your email and password.";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        errorText =
                            "Incorrect email or password.";

                    }


                    if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        errorText =
                            "Too many attempts. Please try again later.";

                    }


                    if (
                        error.code ===
                        "auth/user-disabled"
                    ) {

                        errorText =
                            "This account has been disabled.";

                    }


                    showMessage(errorText);


                } finally {

                    loginButton.disabled = false;

                    loginButton.innerHTML =
                        "Login Securely <span>→</span>";

                }

            }
        );
        /* =========================
           FORGOT PASSWORD
        ========================== */

        document
            .getElementById("forgotButton")
            .addEventListener(
                "click",
                async () => {

                    const email =
                        emailInput.value.trim();


                    if (!email) {

                        showMessage(
                            "Enter your email address first."
                        );

                        emailInput.focus();

                        return;
                    }


                    try {

                        await sendPasswordResetEmail(
                            auth,
                            email
                        );


                        showMessage(
                            "Password reset email sent successfully.",
                            "success"
                        );


                    } catch (error) {

                        let errorText =
                            "Unable to send password reset email.";


                        if (
                            error.code ===
                            "auth/user-not-found"
                        ) {

                            errorText =
                                "No account found with this email.";

                        }


                        showMessage(errorText);

                    }

                }
            );


        /* =========================
           REGISTER
        ========================== */

        document
            .getElementById("registerButton")
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "register.html";

                }
            );


        /* =========================
           LANGUAGE BUTTON
        ========================== */

        document
            .getElementById("languageButton")
            .addEventListener(
                "click",
                () => {

                    /*
                     * Language system will be connected
                     * in the next version.
                     */

                    showMessage(
                        "English is currently selected.",
                        "success"
                    );

                }
            );


        /* =========================
           REMEMBER ME
        ========================== */

        const remember =
            document.getElementById("remember");


        remember.addEventListener(
            "change",
            () => {

                if (remember.checked) {

                    localStorage.setItem(
                        "nanhiRemember",
                        "true"
                    );

                } else {

                    localStorage.removeItem(
                        "nanhiRemember"
                    );

                }

            }
        );


        /* =========================
           END
        ========================== */

    </script>

</body>

</html>
