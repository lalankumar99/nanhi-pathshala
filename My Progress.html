<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14b8a6">
    <title>My Progress • Nanhi Pathshala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* =========================
           BASE & RESET
        ========================= */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; min-height: 100%; background: #f8fafc; }
        
        body {
            font-family: "Nunito", sans-serif;
            background: radial-gradient(circle at 10% 5%, #ccfbf1 0, transparent 25%),
                        radial-gradient(circle at 90% 10%, #fef3c7 0, transparent 25%), #f8fafc;
            color: #0f172a;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        button { font-family: inherit; border: none; outline: none; background: none; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); }

        /* =========================
           HEADER
        ========================= */
        .header {
            padding: 24px 20px 24px;
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            color: white;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 12px 30px rgba(13,148,136,.18);
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn, .profile-btn {
            width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.2);
            color: white; font-size: 20px; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .header-title-group { display: flex; flex-direction: column; }
        .header-title { font-family: "Quicksand", sans-serif; font-size: 22px; font-weight: 900; line-height: 1.1; }
        .header-subtitle { font-size: 11px; font-weight: 700; color: #ccfbf1; }

        /* =========================
           MAIN CONTENT
        ========================= */
        .content { width: 100%; max-width: 900px; margin: 0 auto; padding: 24px 16px; }

        /* =========================
           HERO STATS CARD
        ========================= */
        .hero-card {
            background: white; border-radius: 24px; padding: 24px;
            box-shadow: 0 10px 30px rgba(13, 148, 136, 0.1); border: 2px solid #f1f5f9;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            margin-bottom: 24px;
        }
        
        .hero-avatar {
            width: 80px; height: 80px; background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 900; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
            margin-bottom: 12px;
        }

        .hero-name { font-family: "Quicksand", sans-serif; font-size: 24px; font-weight: 900; color: #0f172a; margin-bottom: 4px; }
        .hero-level { font-size: 13px; font-weight: 800; color: #14b8a6; background: #ccfbf1; padding: 4px 12px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.5px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 100%; gap: 12px; margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 24px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-value { font-family: "Quicksand", sans-serif; font-size: 28px; font-weight: 900; color: #0f172a; }
        .stat-label { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; }

        /* =========================
           PROGRESS SECTION
        ========================= */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-family: "Quicksand", sans-serif; font-size: 20px; font-weight: 900; color: #134e4a; }

        .activity-list { display: flex; flex-direction: column; gap: 12px; }

        .activity-card {
            background: white; border-radius: 20px; padding: 16px; border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(15,23,42,.03); display: flex; align-items: center; gap: 16px;
        }

        .activity-icon {
            width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
        }
        .icon-quiz { background: #dcfce7; color: #16a34a; }
        .icon-video { background: #fee2e2; color: #ef4444; }
        .icon-learn { background: #e0e7ff; color: #4f46e5; }

        .activity-info { flex: 1; }
        .activity-title { font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .activity-meta { font-size: 11px; font-weight: 700; color: #64748b; }

        .activity-score { text-align: right; }
        .score-val { font-family: "Quicksand", sans-serif; font-size: 18px; font-weight: 900; color: #14b8a6; }
        .score-lbl { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }

        /* =========================
           EMPTY & LOADING STATES
        ========================= */
        .empty-state { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; background: white; border-radius: 20px; border: 2px dashed #e2e8f0; }
        .empty-icon { font-size: 56px; margin-bottom: 12px; }
        .empty-title { font-family: "Quicksand", sans-serif; font-size: 20px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
        .empty-desc { color: #64748b; font-size: 14px; font-weight: 600; }
        
        .page-loader { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
        .loading-logo { width: 68px; height: 68px; border-radius: 22px; background: linear-gradient(145deg, #2dd4bf, #0d9488); display: flex; align-items: center; justify-content: center; font-size: 32px; animation: float 1.5s ease-in-out infinite; margin-bottom: 16px; }
        .loading-text { color: #0f766e; font-size: 15px; font-weight: 800; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* =========================
           BOTTOM NAVIGATION
        ========================= */
        .bottom-nav {
            position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50; height: 68px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 6px;
            border-radius: 24px; background: rgba(255,255,255,.94); backdrop-filter: blur(18px); border: 1px solid rgba(226,232,240,.9); box-shadow: 0 15px 40px rgba(15,23,42,.12);
        }
        .nav-item { height: 55px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 18px; color: #94a3b8; cursor: pointer; transition: 0.2s; }
        .nav-item:active { transform: scale(0.95); }
        .nav-item span { font-size: 22px; }
        .nav-item small { font-size: 10px; font-weight: 800; }
        .nav-item.active { background: #f0fdfa; color: #0d9488; }
    </style>
</head>
<body>

    <!-- PAGE LOADER -->
    <div class="page-loader" id="pageLoader">
        <div class="loading-logo">🏆</div>
        <div class="loading-text">लर्निंग प्रोग्रेस लोड हो रही है...</div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='home.html'" aria-label="Go Back">←</button>
            <div class="header-title-group">
                <h1 class="header-title">My Progress</h1>
                <span class="header-subtitle">Track your learning journey</span>
            </div>
        </div>
        <button class="profile-btn" onclick="window.location.href='profile.html'" aria-label="Profile">👤</button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="content">
        
        <!-- Hero Stats (Student Info) -->
        <div class="hero-card">
            <div class="hero-avatar" id="userAvatar">S</div>
            <h2 class="hero-name" id="userName">Student</h2>
            <div class="hero-level">Super Learner 🌟</div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="statQuizzes">0</div>
                    <div class="stat-label">क्विज़ दिए</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statScore">0%</div>
                    <div class="stat-label">औसत अंक</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statVideos">0</div>
                    <div class="stat-label">वीडियो देखे</div>
                </div>
            </div>
        </div>

        <!-- Recent Activities -->
        <div class="section-header">
            <h3 class="section-title">हाल की गतिविधियाँ</h3>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">🤷‍♂️</div>
            <h2 class="empty-title">अभी कोई प्रोग्रेस नहीं है</h2>
            <p class="empty-desc">क्विज़ खेलें या वीडियो देखें, आपकी प्रगति यहाँ दिखाई देगी।</p>
        </div>

        <div class="activity-list" id="activityList">
            <!-- Activities injected via JS -->
        </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="window.location.href='home.html'"><span>🏠</span><small>Home</small></button>
        <button class="nav-item" onclick="window.location.href='content.html'"><span>📚</span><small>Learn</small></button>
        <button class="nav-item" onclick="window.location.href='videos.html'"><span>🎬</span><small>Videos</small></button>
        <button class="nav-item" onclick="window.location.href='quiz.html'"><span>🧠</span><small>Quiz</small></button>
        <button class="nav-item" onclick="window.location.href='profile.html'"><span>👤</span><small>Profile</small></button>
    </nav>

    <!-- ==========================================
         JAVASCRIPT & FIREBASE LOGIC
    =========================================== -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
        import { collection, onSnapshot, query, where, orderBy, getDoc, doc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const activityList = document.getElementById("activityList");
        const emptyState = document.getElementById("emptyState");
        const pageLoader = document.getElementById("pageLoader");
        
        let allQuizzes = {}; // Store quiz names
        
        /* --- 1. Auth Check --- */
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("login.html");
                return;
            }

            // Set User Info
            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                let finalName = "Student";
                if(userSnap.exists() && userSnap.data().name) {
                    finalName = userSnap.data().name;
                } else if(user.displayName) {
                    finalName = user.displayName;
                }
                
                document.getElementById('userName').textContent = finalName;
                document.getElementById('userAvatar').textContent = finalName.charAt(0).toUpperCase();
            } catch(e) {}

            fetchQuizData(user.uid);
        });

        /* --- 2. Fetch Quiz Names First --- */
        // We need this to match quizId with actual Quiz Names
        function fetchQuizData(uid) {
            onSnapshot(collection(db, "quizzes"), (snap) => {
                allQuizzes = {};
                snap.forEach(doc => {
                    allQuizzes[doc.id] = doc.data().title || "Learning Quiz";
                });
                fetchStudentProgress(uid); // Once we have names, fetch progress
            });
        }

        /* --- 3. Fetch Real-time Progress --- */
        function fetchStudentProgress(uid) {
            const progRef = collection(db, "student_progress");
            // Get data for this specific student only, sorted by newest first
            const q = query(progRef, where("uid", "==", uid), orderBy("completedAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                let html = "";
                let quizCount = 0;
                let totalPct = 0;
                let videoCount = 0;

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    
                    if (data.type === "quiz") {
                        quizCount++;
                        totalPct += (data.percentage || 0);
                        
                        const quizName = allQuizzes[data.quizId] || "क्विज़";
                        const date = data.completedAt ? new Date(data.completedAt.toDate()).toLocaleDateString() : 'हाल ही में';
                        const scoreStr = `${data.score} / ${data.totalQuestions}`;

                        html += `
                            <div class="activity-card">
                                <div class="activity-icon icon-quiz">🧠</div>
                                <div class="activity-info">
                                    <div class="activity-title">${quizName}</div>
                                    <div class="activity-meta">✅ पूर्ण किया गया • ${date}</div>
                                </div>
                                <div class="activity-score">
                                    <div class="score-val">${data.percentage}%</div>
                                    <div class="score-lbl">${scoreStr}</div>
                                </div>
                            </div>
                        `;
                    }
                    else if(data.type === "video") {
                        videoCount++;
                        // If you log video views in the future, it will render here automatically
                    }
                });

                // Update Top Stats
                document.getElementById('statQuizzes').textContent = quizCount;
                document.getElementById('statVideos').textContent = videoCount;
                
                if(quizCount > 0) {
                    const avg = Math.round(totalPct / quizCount);
                    document.getElementById('statScore').textContent = `${avg}%`;
                }

                // Render List
                if (html === "") {
                    activityList.innerHTML = "";
                    emptyState.style.display = "flex";
                } else {
                    emptyState.style.display = "none";
                    activityList.innerHTML = html;
                }

                // Hide Loader
                setTimeout(() => {
                    pageLoader.style.opacity = '0';
                    setTimeout(() => pageLoader.style.display = 'none', 300);
                }, 400);

            }, (error) => {
                console.error("Progress fetch error (Needs Firestore Index?):", error);
                
                // Firestore often requires a compound index for "where + orderBy". 
                // If the index is missing, it throws an error with a direct link to create it.
                // We fallback to a simple query without sorting if it fails.
                fallbackProgressFetch(uid);
            });
        }

        /* --- 4. Fallback (If Firestore Index is missing) --- */
        function fallbackProgressFetch(uid) {
            const q = query(collection(db, "student_progress"), where("uid", "==", uid));
            onSnapshot(q, (snapshot) => {
                let items = [];
                snapshot.forEach(docSnap => items.push(docSnap.data()));
                
                // Sort in memory (newest first)
                items.sort((a, b) => {
                    const tA = a.completedAt ? a.completedAt.toMillis() : 0;
                    const tB = b.completedAt ? b.completedAt.toMillis() : 0;
                    return tB - tA;
                });

                let html = "";
                let quizCount = 0, totalPct = 0, videoCount = 0;

                items.forEach(data => {
                    if (data.type === "quiz") {
                        quizCount++;
                        totalPct += (data.percentage || 0);
                        const quizName = allQuizzes[data.quizId] || "क्विज़";
                        const date = data.completedAt ? new Date(data.completedAt.toDate()).toLocaleDateString() : 'हाल ही में';
                        
                        html += `
                            <div class="activity-card">
                                <div class="activity-icon icon-quiz">🧠</div>
                                <div class="activity-info">
                                    <div class="activity-title">${quizName}</div>
                                    <div class="activity-meta">✅ पूर्ण किया गया • ${date}</div>
                                </div>
                                <div class="activity-score">
                                    <div class="score-val">${data.percentage}%</div>
                                    <div class="score-lbl">${data.score}/${data.totalQuestions}</div>
                                </div>
                            </div>
                        `;
                    }
                });

                document.getElementById('statQuizzes').textContent = quizCount;
                if(quizCount > 0) document.getElementById('statScore').textContent = `${Math.round(totalPct / quizCount)}%`;

                if (html === "") {
                    emptyState.style.display = "flex";
                } else {
                    activityList.innerHTML = html;
                }
                
                pageLoader.style.display = 'none';
            });
        }
    </script>
</body>
</html>
